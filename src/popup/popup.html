<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Netflix Dual Subtitles</title>
  </head>
  <body>
    <h1>Dual Subtitles</h1>

    <p id="status" class="status"></p>

    <div id="main" class="main" style="display: none">
      <label class="field">
        <span>Primary subtitle</span>
        <select id="primary"></select>
      </label>

      <label class="field">
        <span>Secondary subtitle</span>
        <select id="secondary"></select>
      </label>

      <fieldset class="display">
        <legend>Display</legend>

        <label class="row">
          <input type="checkbox" id="primaryOnTop" />
          <span>Primary on top</span>
        </label>

        <label class="row">
          <input type="checkbox" id="background" />
          <span>Background behind text</span>
        </label>

        <label class="row slider">
          <span>Font size</span>
          <input type="range" id="fontScale" min="0.6" max="2" step="0.1" />
        </label>

        <label class="row slider">
          <span>Height from bottom</span>
          <input type="range" id="verticalOffset" min="0" max="240" step="4" />
        </label>
      </fieldset>
    </div>

    <footer class="support">
      <span>made this in my free time. if it helps you out:</span>
      <div class="links">
        <!-- <a href="https://github.com/sponsors/wannabelynx" target="_blank" rel="noopener noreferrer">GitHub Sponsors</a> -->
        <a href="https://buymeacoffee.com/wannabelynx" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
      </div>
    </footer>

    <script src="../shared/messages.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
